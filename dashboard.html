<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark" data-theme-setting="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IG TOOLs - AvidKiya</title>
  <link rel="icon" type="image/png" href="assets/icons/icon-128.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ======================= inline SVG icon sprite ======================= -->

      <symbol id="i-external" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M21 21l-4.35-4.35"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path fill="currentColor" d="M6 4h4v16H6zM14 4h4v16h-4z"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M6 4l14 8-14 8z"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/></symbol>

      <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M8 21h8M12 17v4"/></symbol>

      <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M20 6L9 17l-5-5"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M18 6L6 18M6 6l12 12"/></symbol>
      <symbol id="i-minus-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M8 12h8"/></symbol>
      <symbol id="i-filter" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M22 3H2l8 9.46V19l4 2v-8.54z"/></symbol>
      <symbol id="i-sort" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M11 5h10M11 9h7M11 13h4M3 17l3 3 3-3M6 18V4"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 16v-4M12 8h.01"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 6v6l4 2"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></symbol>
      <symbol id="i-brand-x" viewBox="0 0 24 24"><path fill="currentColor" d="M18.9 2H22l-6.77 7.74L23.2 22h-6.23l-4.88-6.38L6.5 22H3.35l7.24-8.28L2.8 2h6.39l4.41 5.83L18.9 2zm-1.1 18.1h1.72L7.7 3.8H5.85l11.95 16.3z"/></symbol>
      <symbol id="i-github" viewBox="0 0 24 24"><path fill="currentColor" d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.69 5.41-5.25 5.69.41.36.78 1.06.78 2.14 0 1.55-.01 2.8-.01 3.18 0 .31.21.68.8.56A11.52 11.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></symbol>

      <symbol id="i-megaphone" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M3 11l18-7v16l-18-7v-2z"/><path fill="none" stroke="currentColor" stroke-width="2" d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></symbol>
      <symbol id="i-lightbulb" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.4 1 2.3h6c0-.9.4-1.8 1-2.3A7 7 0 0 0 12 2z"/></symbol>
      <symbol id="i-user-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M8.5 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM17 8l2 2 4-4"/></symbol>
      <symbol id="i-user-minus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M8.5 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 8h-6"/></symbol>
    </defs>
  </svg>

  <div class="app">

    <!-- ======================= top bar ======================= -->
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="assets/icons/icon-128.png" alt="IG Unfollow - AvidKiya logo" width="46" height="46" />
        <div>
          <h1>IG TOOLs - AvidKiya</h1>
          <p class="tagline" data-i18n="app.subtitle"></p>
        </div>
      </div>
      <div class="spacer"></div>
      <select id="langSelect" class="input" data-i18n-aria="lang.label">
        <option value="fa">فارسی</option>
        <option value="en">English</option>
      </select>
      <button id="themeBtn" class="btn icon-only" data-i18n-aria="theme.toggle" data-i18n-title="theme.toggle">
        <svg class="icon" id="themeIcon"><use href="#i-moon"></use></svg>
      </button>
    </header>

    <!-- ======================= tabs ======================= -->
    <nav class="tabs" role="tablist" aria-label="Main">
      <button class="tab-btn" role="tab" id="tab-dashboard" aria-selected="true" aria-controls="panel-dashboard" data-tab="dashboard">
        <svg class="icon"><use href="#i-grid"></use></svg><span data-i18n="nav.dashboard"></span>
      </button>
      <button class="tab-btn" role="tab" id="tab-nonfollowers" aria-selected="false" aria-controls="panel-nonfollowers" data-tab="nonfollowers" tabindex="-1">
        <svg class="icon"><use href="#i-user-minus"></use></svg><span data-i18n="nav.nonfollowers"></span>
      </button>
      <button class="tab-btn" role="tab" id="tab-protected" aria-selected="false" aria-controls="panel-protected" data-tab="protected" tabindex="-1">
        <svg class="icon"><use href="#i-shield"></use></svg><span data-i18n="nav.protected"></span>
      </button>
      <button class="tab-btn" role="tab" id="tab-activity" aria-selected="false" aria-controls="panel-activity" data-tab="activity" tabindex="-1">
        <svg class="icon"><use href="#i-pulse"></use></svg><span data-i18n="nav.activity"></span>
      </button>
      <button class="tab-btn" role="tab" id="tab-marketing" aria-selected="false" aria-controls="panel-marketing" data-tab="marketing" tabindex="-1">
        <svg class="icon"><use href="#i-megaphone"></use></svg><span data-i18n="nav.marketing"></span>
      </button>
      <button class="tab-btn" role="tab" id="tab-coach" aria-selected="false" aria-controls="panel-coach" data-tab="coach" tabindex="-1">
        <svg class="icon"><use href="#i-target"></use></svg><span data-i18n="nav.coach"></span>
      </button>
      <button class="tab-btn" role="tab" id="tab-settings" aria-selected="false" aria-controls="panel-settings" data-tab="settings" tabindex="-1">
        <svg class="icon"><use href="#i-gear"></use></svg><span data-i18n="nav.settings"></span>
      </button>
      <button class="tab-btn" role="tab" id="tab-support" aria-selected="false" aria-controls="panel-support" data-tab="support" tabindex="-1">
        <svg class="icon"><use href="#i-heart"></use></svg><span data-i18n="nav.support"></span>
      </button>
    </nav>

    <main>
      <!-- ======================= DASHBOARD ======================= -->
      <section class="tab-panel active" id="panel-dashboard" role="tabpanel" aria-labelledby="tab-dashboard" tabindex="0">

        <div id="resumeBanner" class="resume-banner" hidden>
          <div class="rb-text">
            <b data-i18n="queue.resumeTitle"></b>
            <div id="resumeText" class="muted"></div>
          </div>
          <div class="btnrow">
            <button id="resumeBtn" class="btn primary"><svg class="icon"><use href="#i-play"></use></svg><span data-i18n="queue.resume"></span></button>
            <button id="resumeClearBtn" class="btn danger"><svg class="icon"><use href="#i-trash"></use></svg><span data-i18n="queue.clear"></span></button>
          </div>
        </div>

        <div id="loginWarn" class="note warn" hidden>
          <svg class="icon"><use href="#i-warn"></use></svg>
          <span data-i18n="dashboard.loginRequired"></span>
          <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" data-i18n="dashboard.openInstagram"></a>
        </div>

        <!-- کارت لاگین مخصوص نسخهٔ وب لوکال -->
        <div id="webLoginBar" class="card" hidden style="margin-bottom:16px">
          <h3 class="section-title" style="margin-top:0"><svg class="icon"><use href="#i-lock"></use></svg><span data-i18n="web.loginTitle"></span></h3>
          <p class="muted" style="font-size:.82rem;margin-top:-4px" data-i18n="web.loginDesc"></p>
          <form id="wlForm" class="toolbar" style="margin-bottom:0">
            <div class="field"><label for="wlUser" data-i18n="web.user"></label><input id="wlUser" class="input mono" style="direction:ltr" autocomplete="username" /></div>
            <div class="field"><label for="wlPass" data-i18n="web.pass"></label><input id="wlPass" class="input mono" style="direction:ltr" type="password" autocomplete="current-password" /></div>
            <div class="field" id="wlCodeWrap" hidden><label for="wlCode" data-i18n="web.code2fa"></label><input id="wlCode" class="input mono" style="direction:ltr" inputmode="numeric" autocomplete="one-time-code" /></div>
            <button id="wlLogin" type="submit" class="btn primary"><svg class="icon"><use href="#i-check"></use></svg><span id="wlLoginLabel" data-i18n="web.loginBtn"></span></button>
            <button id="wlLogout" type="button" class="btn danger sm" hidden><span data-i18n="web.logoutBtn"></span></button>
          </form>
          <p class="muted" id="wlStatus" style="margin:8px 0 0;font-size:.8rem"></p>
        </div>

        <div class="stats-grid" id="statsGrid">
          <div class="stat"><div class="stat-label"><svg class="icon"><use href="#i-users"></use></svg><span data-i18n="dashboard.statFollowing"></span></div><div class="stat-value" id="stFollowing">—</div></div>
          <div class="stat"><div class="stat-label"><svg class="icon"><use href="#i-user-check"></use></svg><span data-i18n="dashboard.statFollowers"></span></div><div class="stat-value" id="stFollowers">—</div></div>
          <div class="stat"><div class="stat-label"><svg class="icon"><use href="#i-user-minus"></use></svg><span data-i18n="dashboard.statNonFollowers"></span></div><div class="stat-value accent" id="stNonFollowers">—</div></div>
          <div class="stat"><div class="stat-label"><svg class="icon"><use href="#i-shield"></use></svg><span data-i18n="dashboard.statProtected"></span></div><div class="stat-value" id="stProtected">—</div></div>
          <div class="stat"><div class="stat-label"><svg class="icon"><use href="#i-minus-circle"></use></svg><span data-i18n="dashboard.statToday"></span></div><div class="stat-value" id="stToday">—</div></div>
          <div class="stat"><div class="stat-label"><svg class="icon"><use href="#i-clock"></use></svg><span data-i18n="dashboard.statLastScan"></span></div><div class="stat-hint" id="stLastScanTime" data-i18n="dashboard.neverScanned"></div></div>
        </div>

        <div class="card" id="diffCard" hidden>
          <h3><svg class="icon"><use href="#i-pulse"></use></svg> <span data-i18n="common.fromLastScan"></span></h3>
          <div class="diff-row">
            <span class="diff-chip"><b id="diffNew">0</b><span data-i18n="dashboard.diffNewNonFollowers"></span></span>
            <span class="diff-chip"><b id="diffNewFollowers">0</b><span data-i18n="dashboard.diffNewFollowers"></span></span>
            <span class="diff-chip"><b id="diffRemoved">0</b><span data-i18n="dashboard.diffRemoved"></span></span>
          </div>
          <p class="muted" style="font-size:.78rem;margin:10px 0 0" data-i18n="dashboard.removedNote"></p>
        </div>

        <div style="margin-top:16px" class="btnrow">
          <button id="scanBtn" class="btn primary"><svg class="icon"><use href="#i-scan"></use></svg><span id="scanBtnLabel" data-i18n="dashboard.scanBtn"></span></button>
        </div>

        <!-- live scan progress -->
        <div id="scanPanel" class="card scan-panel" hidden>
          <h3 data-i18n="dashboard.progress.title"></h3>
          <div class="stepper" role="list">
            <span class="step" id="stepFollowing" role="listitem"><i class="dot"></i><span data-i18n="dashboard.progress.stepFollowing"></span></span>
            <span class="step" id="stepFollowers" role="listitem"><i class="dot"></i><span data-i18n="dashboard.progress.stepFollowers"></span></span>
            <span class="step" id="stepComparing" role="listitem"><i class="dot"></i><span data-i18n="dashboard.progress.stepComparing"></span></span>
          </div>
          <div class="progress" id="scanProgress"><i></i></div>
          <div class="scan-counters">
            <div class="sc"><div class="k" data-i18n="dashboard.progress.pages"></div><div class="v" id="cPages">0</div></div>
            <div class="sc"><div class="k" data-i18n="dashboard.progress.followingFetched"></div><div class="v" id="cFollowing">0</div></div>
            <div class="sc"><div class="k" data-i18n="dashboard.progress.followersFetched"></div><div class="v" id="cFollowers">0</div></div>
            <div class="sc"><div class="k" data-i18n="dashboard.progress.tempNonFollowers"></div><div class="v" id="cTempNF">0</div></div>
            <div class="sc"><div class="k" data-i18n="dashboard.progress.elapsed"></div><div class="v" id="cElapsed">0s</div></div>
          </div>
          <div class="muted" style="margin-top:8px;font-size:.82rem"><span data-i18n="dashboard.progress.livePreview"></span> · <span id="scanStatusMsg"></span></div>
          <div class="live-preview" id="livePreview"></div>
          <div class="btnrow" style="margin-top:14px">
            <button id="cancelScanBtn" class="btn danger"><svg class="icon"><use href="#i-stop"></use></svg><span data-i18n="dashboard.progress.cancel"></span></button>
          </div>
        </div>

        <!-- queue panel -->
        <div id="queuePanel" class="queue-panel" hidden>
          <h3 class="section-title" style="margin-top:0"><svg class="icon"><use href="#i-pulse"></use></svg><span data-i18n="queue.progress"></span></h3>
          <div class="progress"><i id="qProgressBar"></i></div>
          <div class="queue-grid">

            <p class="muted" style="font-size:.84rem" data-i18n="ai.cardDesc"></p>
            <div class="preset-cards" id="aiModeCards" style="margin-bottom:12px"></div>
            <div class="custom-fields" style="margin-top:0">
              <div class="field"><label for="aiUrl" data-i18n="ai.urlLabel"></label><input id="aiUrl" class="input mono" style="direction:ltr" placeholder="http://127.0.0.1:11434" spellcheck="false" /></div>
              <div class="field"><label for="aiModel" data-i18n="ai.modelLabel"></label><select id="aiModel" class="input"></select></div>
              <div class="field"><label for="aiTone" data-i18n="ai.toneLabel"></label>
                <select id="aiTone" class="input">
                  <option value="friendly" data-i18n="ai.tone.friendly"></option>
                  <option value="pro" data-i18n="ai.tone.pro"></option>
                  <option value="fun" data-i18n="ai.tone.fun"></option>
                </select>
              </div>
            </div>
            <div class="btnrow" style="margin-top:10px">
              <button id="aiTest" class="btn sm"><svg class="icon"><use href="#i-pulse"></use></svg><span id="aiTestLabel" data-i18n="ai.test"></span></button>
              <button id="aiRefreshModels" class="btn sm ghost"><svg class="icon"><use href="#i-search"></use></svg><span data-i18n="ai.refreshModels"></span></button>
            </div>
            <label class="switch" style="margin-top:12px">
              <input type="checkbox" id="aiAutoClassify" />
              <span class="track"></span>
              <span class="sw-label" data-i18n="ai.autoClassify"></span>
            </label>
            <p class="muted" id="aiStatusNote" style="font-size:.8rem;margin:8px 0 0"></p>
            <div class="note" style="margin-top:10px"><svg class="icon"><use href="#i-info"></use></svg> <span data-i18n="ai.setupSteps"></span></div>
            <div class="note muted" style="margin-top:8px"><svg class="icon"><use href="#i-shield"></use></svg> <span data-i18n="ai.manualOnly"></span></div>
          </div>

          <div class="card">
            <h3><svg class="icon"><use href="#i-moon"></use></svg> <span data-i18n="settings.appearance"></span></h3>
            <div class="field" style="margin-bottom:10px">
              <label for="sTheme" data-i18n="settings.themeLabel"></label>
              <select id="sTheme" class="input">
                <option value="dark" data-i18n="theme.dark"></option>
                <option value="light" data-i18n="theme.light"></option>
                <option value="system" data-i18n="theme.system"></option>
              </select>
            </div>
            <div class="field" style="margin-bottom:10px">
              <label for="sLang" data-i18n="settings.langLabel"></label>
              <select id="sLang" class="input">
                <option value="fa">فارسی</option>
                <option value="en">English</option>
              </select>
            </div>
            <div class="field">
              <label for="sIgUsername" data-i18n="settingsExtra.igUsernameLabel"></label>
              <input id="sIgUsername" class="input mono" style="direction:ltr" data-i18n-placeholder="settingsExtra.igUsernamePh" spellcheck="false" />
              <span class="muted" style="font-size:.74rem" data-i18n="settingsExtra.igUsernameHelp"></span>
            </div>
          </div>

          <div class="card">
            <h3><svg class="icon"><use href="#i-trash"></use></svg> <span data-i18n="settings.dataTitle"></span></h3>
            <div class="btnrow">
              <button id="exportAllBtn" class="btn sm"><svg class="icon"><use href="#i-download"></use></svg><span data-i18n="settings.exportAll"></span></button>
              <button id="importAllBtn" class="btn sm"><svg class="icon"><use href="#i-upload"></use></svg><span data-i18n="settings.importAll"></span></button>
              <button id="clearDataBtn" class="btn sm danger"><svg class="icon"><use href="#i-trash"></use></svg><span data-i18n="settings.clearData"></span></button>
            </div>
          </div>

          <div class="card">
            <h3><svg class="icon"><use href="#i-external"></use></svg> <span data-i18n="settings.linksTitle"></span></h3>
            <div class="btnrow">
              <a id="privacyLink" class="btn sm" href="https://github.com/avidkiya" target="_blank" rel="noopener noreferrer"><svg class="icon"><use href="#i-shield"></use></svg><span data-i18n="settings.privacy"></span></a>
              <a id="githubLink" class="btn sm" href="https://github.com/avidkiya" target="_blank" rel="noopener noreferrer"><svg class="icon"><use href="#i-github"></use></svg><span data-i18n="settings.github"></span></a>
            </div>
          </div>
        </div>
      </section>

      <!-- ======================= SUPPORT ======================= -->
      <section class="tab-panel" id="panel-support" role="tabpanel" aria-labelledby="tab-support" tabindex="0" hidden>
        <div class="support-hero">
          <img src="assets/icons/icon-256.png" alt="AvidKiya" width="88" height="88" />
          <h2>IG Unfollow - AvidKiya</h2>
          <p class="big" data-i18n="support.text"></p>
          <p class="muted" data-i18n="support.noAds"></p>
          <div class="support-links">
            <a class="support-link" href="https://instagram.com/avidkiya" target="_blank" rel="noopener noreferrer">
              <svg class="icon"><use href="#i-camera"></use></svg><span data-i18n="support.instagram"></span> <span class="mono">@avidkiya</span>
            </a>
            <a class="support-link" href="https://t.me/avidkiya" target="_blank" rel="noopener noreferrer">
              <svg class="icon"><use href="#i-send"></use></svg><span data-i18n="support.telegram"></span> <span class="mono">@avidkiya</span>
            </a>
            <a class="support-link" href="https://x.com/avidkiya" target="_blank" rel="noopener noreferrer">
              <svg class="icon"><use href="#i-brand-x"></use></svg><span data-i18n="support.x"></span> <span class="mono">@avidkiya</span>
            </a>
            <a class="support-link" id="supportGithub" href="https://github.com/avidkiya" target="_blank" rel="noopener noreferrer">
              <svg class="icon"><use href="#i-github"></use></svg><span data-i18n="support.github"></span> <span class="mono">@avidkiya</span>
            </a>
            <a class="support-link" id="supportStar" href="https://github.com/avidkiya" target="_blank" rel="noopener noreferrer" style="border-color:var(--accent)">
              <svg class="icon"><use href="#i-star"></use></svg><span data-i18n="support.star"></span>
            </a>
          </div>
        </div>
      </section>
    </main>

    <footer class="muted" style="margin-top:36px;font-size:.78rem;text-align:center">
      <span data-i18n="app.byline"></span> · v4.2.0 · <span data-i18n="support.noAds"></span>
    </footer>
  </div>

  <!-- modal root -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" id="modalBox">
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- toasts -->
  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
